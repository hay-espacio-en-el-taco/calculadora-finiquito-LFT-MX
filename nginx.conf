server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA con navegación por hash: cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
